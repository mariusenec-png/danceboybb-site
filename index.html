<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DanceboyBB</title>
<meta name="description" content="DanceboyBB - live-uri, gaming și distracție. Toate linkurile într-un singur loc.">
<meta property="og:title" content="DanceboyBB">
<meta property="og:description" content="Live-uri, gaming și distracție. Toate linkurile într-un singur loc.">
<meta property="og:image" content="avatar.webp">
<link rel="icon" href="avatar.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:ital,wght@0,400;0,500;0,700;1,700&display=swap" rel="stylesheet">
<style>
/* VOICE: DanceboyBB's own stream brand - loud, playful, gamer night energy.
   IDEA: the stream's "starting soon" scene - a neon stage with toy bricks floating around the streamer.
   PICTURE: the round avatar in a glowing purple-blue ring, surrounded by floating red/blue/purple bricks.
   COLOUR and TYPE: black ground, neon purple + electric blue, hot pink and brick red accents; Lilita One wordmark + Rubik.
   LAYOUT: full-width hero stage, a grid of neon-outlined link badges like the overlay, then a small footer. */
:root{color-scheme:dark;--bg:#05040c;--ink:#ffffff;--soft:#b9b4d9;--purple:#9b3dff;--blue:#1e8bff;--pink:#ff3fd0;--red:#ff2b3a;--panel:#0d0a1d}
:root[data-theme=light]{color-scheme:dark}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.wrap{max-width:1040px;margin:0 auto}

/* Hero stage */
.hero{position:relative;isolation:isolate;overflow:hidden;text-align:center;padding-top:clamp(36px,6vw,80px);
  background:
    radial-gradient(40% 50% at 18% 35%,rgba(155,61,255,.45),transparent 70%),
    radial-gradient(40% 50% at 82% 40%,rgba(30,139,255,.40),transparent 70%),
    radial-gradient(60% 40% at 50% 100%,rgba(255,63,208,.22),transparent 70%),
    var(--bg)}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:90px;z-index:-1;
  background:linear-gradient(to top,rgba(155,61,255,.18),transparent),repeating-linear-gradient(90deg,rgba(30,139,255,.18) 0 1px,transparent 1px 60px)}
.ring{position:relative;width:clamp(170px,26vw,250px);aspect-ratio:1;margin:0 auto;border-radius:50%;padding:6px;
  background:conic-gradient(from 200deg,var(--purple),var(--blue),var(--pink),var(--purple));
  box-shadow:0 0 30px rgba(155,61,255,.7),0 0 70px rgba(30,139,255,.45)}
.ring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#000}
.word{margin:clamp(18px,3vw,28px) 0 0;font:400 clamp(46px,9.5vw,96px)/1.05 "Lilita One",Impact,sans-serif;text-wrap:balance;
  color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 4px 0 #1b0f3a,0 0 26px rgba(155,61,255,.75)}
.word b{font-weight:400;background:linear-gradient(180deg,#5fc0ff,var(--blue) 60%,#1259d6);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(0 4px 0 #0b1f5e) drop-shadow(0 0 18px rgba(30,139,255,.8))}
.live{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:6px 22px;border-radius:999px;
  background:linear-gradient(90deg,var(--purple),#6a2bff);font:italic 700 18px Rubik,sans-serif;box-shadow:0 0 22px rgba(155,61,255,.7)}
.live::before{content:"";width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
.tag{margin:16px auto 0;max-width:32em;font-size:clamp(16px,2.2vw,19px);color:var(--soft)}

/* Floating bricks */
.bricks{position:absolute;inset:0;z-index:-1;pointer-events:none}
.brick{position:absolute;width:var(--s);height:var(--s);color:var(--c);filter:drop-shadow(0 0 14px var(--c));animation:float var(--d) ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-14px) rotate(calc(var(--r) + 6deg))}}

/* Link badges */
.links{background:linear-gradient(var(--bg),#0a0718)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
/* Each badge is filled with its platform's colour (--bg may be a gradient), --ink is the text colour on it */
.badge{position:relative;display:flex;align-items:center;gap:16px;min-height:84px;padding:14px 20px;border-radius:16px;
  background:var(--bg);color:var(--ink,#fff);text-decoration:none;border:2px solid rgba(255,255,255,.14);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),0 0 18px color-mix(in srgb,var(--c) 55%,transparent);
  transition:transform .15s,box-shadow .15s}
a.badge:hover{transform:translateY(-3px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),0 0 30px var(--c)}
a.badge:focus-visible,.copy:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ico{flex:none;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);color:currentColor}
.ico svg{width:27px;height:27px}
.ico img{width:30px;height:30px;object-fit:contain}
.txt{flex:1;display:grid;gap:1px;justify-items:start}
.txt b{font-size:19px;line-height:1.2}
.txt i{font-style:italic;font-weight:700;font-size:15px;opacity:.85}
.go{flex:none;font-size:22px;font-weight:700}
.badge.off{opacity:.55;box-shadow:none}

/* LIVE NOW - shown only while Stream Hub reports the platform live */
.onair{display:none;align-items:center;gap:7px;padding:3px 11px;border-radius:999px;background:#fff;color:#e8001c;
  font:italic 700 13px/1.3 Rubik,sans-serif;letter-spacing:.04em;white-space:nowrap;box-shadow:0 0 12px var(--red)}
.onair::before{content:"";width:9px;height:9px;border-radius:50%;background:#e8001c;box-shadow:0 0 8px #e8001c;animation:blink 1s ease-in-out infinite}
.badge.is-live .onair{display:inline-flex;animation:glow 1.4s ease-in-out infinite}
.badge.is-live{animation:livering 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.15;transform:scale(.7)}}
@keyframes glow{50%{box-shadow:0 0 22px var(--red),0 0 40px rgba(255,43,58,.6)}}
@keyframes livering{50%{box-shadow:0 0 30px var(--c),0 0 60px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 24px color-mix(in srgb,var(--c) 35%,transparent)}}
.live.on{background:linear-gradient(90deg,var(--red),var(--pink));color:#fff;text-decoration:none;animation:glow 1.4s ease-in-out infinite}
.live.on::before{animation:blink 1s ease-in-out infinite}
a.live.on:focus-visible{outline:3px solid #fff;outline-offset:3px}
.badge.off .go{font-size:13px;color:var(--soft);white-space:nowrap}

/* Live schedule - each day is a toy brick with studs on top */
.sched-band{background:#0a0718;padding-top:0}
.sched-title{margin:0;text-align:center;font:400 clamp(32px,5vw,46px)/1.05 "Lilita One",Impact,sans-serif;text-shadow:0 0 22px rgba(155,61,255,.6)}
.sched-title b{font-weight:400;color:var(--blue)}
.next{margin:10px auto 0;text-align:center;font-weight:700;font-size:17px;color:#fff}
.next span{color:var(--pink);white-space:nowrap}
.sched{list-style:none;margin:34px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.day{position:relative;padding:18px 10px 16px;border-radius:10px;text-align:center;background:var(--c);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.18),0 0 16px color-mix(in srgb,var(--c) 45%,transparent)}
.day::before{content:"";position:absolute;left:50%;top:-11px;width:64%;height:12px;transform:translateX(-50%);
  background:radial-gradient(circle at 25% 60%,var(--c) 0 9px,transparent 10px),radial-gradient(circle at 75% 60%,var(--c) 0 9px,transparent 10px);filter:brightness(1.12)}
.day h3{margin:0;font:400 19px/1.2 "Lilita One",Impact,sans-serif}
.day .hrs{display:block;margin-top:6px;font-weight:700;font-size:17px;white-space:nowrap}
.day .note{display:block;margin-top:2px;font-size:13px;color:rgba(255,255,255,.82)}
.day.off{--c:#2a2346;box-shadow:inset 0 -6px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.08)}
.day.today{outline:3px solid #fff;outline-offset:4px}
.day .now{position:absolute;top:-30px;right:6px;padding:1px 9px;border-radius:999px;background:var(--pink);font-size:13px;font-weight:700;box-shadow:0 0 12px var(--pink)}
.tz{margin:22px 0 0;text-align:center;font-size:14px;color:var(--soft)}

/* Footer */
.foot{background:#0a0718;padding-top:0;text-align:center;color:var(--soft);font-size:15px}
.copy{min-height:44px;padding:10px 22px;border-radius:999px;border:2px solid var(--blue);background:transparent;color:#fff;font:700 16px Rubik,sans-serif;cursor:pointer;box-shadow:0 0 14px rgba(30,139,255,.5)}
.copy:hover{background:var(--blue)}
.foot p{margin:14px 0 0}

@media(max-width:820px){
  .sched{grid-template-columns:minmax(0,1fr);gap:22px;max-width:520px;margin-inline:auto}
  .day{display:grid;grid-template-columns:7.5em 1fr;align-items:center;text-align:start;padding:14px 18px}
  .day .hrs{margin:0}
  .day .note{grid-column:2}
}
@media(max-width:600px){
  .grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .badge{min-height:74px;padding:12px 16px}
  .brick.far{display:none}
}
@media(prefers-reduced-motion:reduce){.brick{animation:none}.badge{transition:none}.badge.is-live,.badge.is-live .onair,.onair::before,.live.on,.live.on::before{animation:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Generic isometric 2x2 toy brick, coloured with currentColor -->
    <symbol id="brick" viewBox="0 0 100 100">
      <path d="M10 30 50 50 50 88 10 68z" fill="currentColor"/>
      <path d="M10 30 50 50 50 88 10 68z" fill="#000" opacity=".28"/>
      <path d="M50 50 90 30 90 68 50 88z" fill="currentColor"/>
      <path d="M50 50 90 30 90 68 50 88z" fill="#000" opacity=".45"/>
      <path d="M50 10 90 30 50 50 10 30z" fill="currentColor"/>
      <path d="M50 10 90 30 50 50 10 30z" fill="#fff" opacity=".12"/>
      <g id="stud">
        <path d="M-8 -6v6a8 4 0 0 0 16 0v-6z" fill="currentColor"/>
        <path d="M-8 -6v6a8 4 0 0 0 16 0v-6z" fill="#000" opacity=".3"/>
        <ellipse cx="0" cy="-6" rx="8" ry="4" fill="currentColor"/>
        <ellipse cx="0" cy="-6" rx="8" ry="4" fill="#fff" opacity=".22"/>
      </g>
      <use href="#stud" x="50" y="22"/>
      <use href="#stud" x="31" y="31"/>
      <use href="#stud" x="69" y="31"/>
      <use href="#stud" x="50" y="40"/>
    </symbol>
  </defs>
</svg>

<header class="band hero">
  <div class="bricks" id="bricks" aria-hidden="true"></div>
  <div class="wrap">
    <div class="ring"><img src="avatar.webp" alt="Avatarul DanceboyBB" width="480" height="480"></div>
    <h1 class="word">Danceboy<b>BB</b></h1>
    <span class="live" id="onair-hero">LIVE</span>
    <p class="tag">Live-uri cu gaming și distracție. Toate locurile unde mă găsești, într-o singură pagină.</p>
  </div>
</header>

<main class="band links">
  <div class="wrap">
    <nav class="grid" id="links" aria-label="Linkuri DanceboyBB"></nav>
  </div>
</main>

<section class="band sched-band" id="program" aria-labelledby="sched-title">
  <div class="wrap">
    <h2 class="sched-title" id="sched-title">Programul de <b>live</b></h2>
    <p class="next" id="next"></p>
    <ol class="sched" id="sched"></ol>
    <p class="tz">Orele sunt în ora României.</p>
  </div>
</section>

<footer class="band foot">
  <div class="wrap">
    <button class="copy" id="copy" type="button">Copiază linkul paginii</button>
    <p>danceboybb.com &middot; &copy; <span id="year"></span> DanceboyBB</p>
  </div>
</footer>

<script>
{
  // ===== SITE CONFIG - edit here =====
  // Leave url empty ("") and the badge shows "în curând" instead of a link.
  const SITE_URL = "https://danceboybb.com";
  // "LIVE NOW" status from DanceboyBB Stream Hub (Settings > General > Live now on your website).
  // Answers only while Stream Hub runs on the stream PC; any error = shown as offline.
  const LIVE_STATUS_URL = "https://live.danceboybb.com/live.json";
  const LIVE_CHECK_SECONDS = 60;

  const ICONS = {
    note: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 3h3a4 4 0 0 0 4 4v3a7 7 0 0 1-4-1.3V15a6 6 0 1 1-6-6v3.2A2.8 2.8 0 1 0 14 15z"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-7l-5 4v-4H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm5 5v4h2V8zm5 0v4h2V8z"/></svg>',
    bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 14h6.5L9 22l11-13h-7z"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor"/></svg>',
    people: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.6"/><path d="M2.5 19c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6zM15.5 19c0-2-.6-3.6-1.7-4.8 3.4-.6 7.7.9 7.7 4.8z"/></svg>'
  };

  // bg = button fill (platform colour, may be a gradient), color = glow, ink = text colour.
  // logo = path to the platform's official icon file (e.g. "icons/tiktok.svg"); empty -> generic glyph from ICONS.
  const LINKS = [
    // live: key in Stream Hub's live.json; liveUrl: where the badge goes while live.
    { name: "TikTok LIVE", handle: "@danceboybb", url: "https://www.tiktok.com/@danceboybb", icon: "note", logo: "",
      bg: "linear-gradient(135deg,#010101 55%,#25f4ee 140%)", color: "#25f4ee", live: "tiktok", liveUrl: "https://www.tiktok.com/@danceboybb/live" },
    { name: "YouTube", handle: "@DanceboyBB", url: "https://www.youtube.com/@DanceboyBB", icon: "play", logo: "",
      bg: "#ff0000", color: "#ff0000", live: "youtube", liveUrl: "https://www.youtube.com/@DanceboyBB/live" },
    { name: "Twitch", handle: "danceboybb", url: "https://www.twitch.tv/danceboybb", icon: "chat", logo: "",
      bg: "#9146ff", color: "#9146ff", live: "twitch", liveUrl: "https://www.twitch.tv/danceboybb" },
    { name: "Kick", handle: "danceboybb", url: "https://kick.com/danceboybb", icon: "bolt", logo: "",
      bg: "#53fc18", color: "#53fc18", ink: "#0b0e0f", live: "kick", liveUrl: "https://kick.com/danceboybb" },
    { name: "Instagram", handle: "marius.ene92", url: "https://www.instagram.com/marius.ene92", icon: "camera", logo: "",
      bg: "linear-gradient(45deg,#feda75,#fa7e1e 25%,#d62976 50%,#962fbf 75%,#4f5bd5)", color: "#d62976" },
    { name: "Facebook", handle: "DanceboyBB", url: "https://www.facebook.com/profile.php?id=100000952430353", icon: "people", logo: "",
      bg: "#1877f2", color: "#1877f2" }
  ];

  // Live schedule (Romania time). live:false = flexible / maybe off.
  const SCHEDULE = [
    { day: "Luni", hours: "19:00 – 22:00+", note: "minim 3 ore", live: true, color: "#1e8bff" },
    { day: "Marți", hours: "19:00 – 22:00+", note: "minim 3 ore", live: true, color: "#9b3dff" },
    { day: "Miercuri", hours: "19:00 – 22:00+", note: "minim 3 ore", live: true, color: "#ff2b3a" },
    { day: "Joi", hours: "19:00 – 22:00+", note: "minim 3 ore", live: true, color: "#1e8bff" },
    { day: "Vineri", hours: "19:00 – 22:00+", note: "minim 3 ore", live: true, color: "#9b3dff" },
    { day: "Sâmbătă", hours: "Flexibil", note: "posibil liber", live: false },
    { day: "Duminică", hours: "Flexibil", note: "posibil liber", live: false }
  ];
  const LIVE_START = "19:00";
  const LIVE_END_HOUR = 22; // after this hour the next scheduled live is the next live day

  // Floating bricks: x/y in %, size in px, colour, rotation, float duration
  const BRICKS = [
    { x: 6, y: 14, s: 74, c: "#ff2b3a", r: -12, d: 3.4 },
    { x: 14, y: 58, s: 56, c: "#9b3dff", r: 10, d: 4.1, far: 1 },
    { x: 3, y: 78, s: 64, c: "#1e8bff", r: 6, d: 3.8, far: 1 },
    { x: 84, y: 10, s: 70, c: "#1e8bff", r: 14, d: 3.6 },
    { x: 90, y: 48, s: 60, c: "#ff2b3a", r: -8, d: 4.3 },
    { x: 78, y: 74, s: 54, c: "#9b3dff", r: 4, d: 3.2, far: 1 },
    { x: 28, y: 8, s: 40, c: "#9b3dff", r: 18, d: 4.6, far: 1 },
    { x: 66, y: 6, s: 44, c: "#ff2b3a", r: -16, d: 3.9, far: 1 }
  ];
  // ===== end config =====

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const badge = l => {
    const glyph = l.logo ? `<img src="${esc(l.logo)}" alt="">` : (ICONS[l.icon] || ICONS.play);
    const inner = `<span class="ico">${glyph}</span>
      <span class="txt"><b>${esc(l.name)}</b><i>${esc(l.handle)}</i>${l.live ? '<span class="onair">LIVE NOW</span>' : ""}</span>`;
    const style = `style="--c:${esc(l.color)};--bg:${esc(l.bg)}${l.ink ? `;--ink:${esc(l.ink)}` : ""}"`;
    return l.url
      ? `<a class="badge" ${style}${l.live ? ` data-live="${esc(l.live)}"` : ""} href="${esc(l.url)}" target="_blank" rel="noopener">${inner}<span class="go" aria-hidden="true">&rarr;</span></a>`
      : `<div class="badge off" ${style} aria-disabled="true">${inner}<span class="go">în curând</span></div>`;
  };
  document.getElementById("links").innerHTML = LINKS.map(badge).join("");

  document.getElementById("bricks").innerHTML = BRICKS.map(b =>
    `<svg class="brick${b.far ? " far" : ""}" style="left:${b.x}%;top:${b.y}%;--s:${b.s}px;--c:${b.c};--r:${b.r}deg;--d:${b.d}s"><use href="#brick"/></svg>`
  ).join("");

  // Current day and hour in Romania (0 = Monday)
  const roParts = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Bucharest", weekday: "short", hour: "numeric", hourCycle: "h23" })
    .formatToParts(new Date()).map(p => [p.type, p.value]));
  const today = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].indexOf(roParts.weekday);
  const hour = Number(roParts.hour);

  document.getElementById("sched").innerHTML = SCHEDULE.map((d, i) => `
    <li class="day${d.live ? "" : " off"}${i === today ? " today" : ""}"${d.live ? ` style="--c:${esc(d.color)}"` : ""}>
      ${i === today ? '<span class="now">Azi</span>' : ""}
      <h3>${esc(d.day)}</h3>
      <span class="hrs">${esc(d.hours)}</span>
      <span class="note">${esc(d.note)}</span>
    </li>`).join("");

  // Next scheduled live (from the schedule only - not a real live status)
  let scheduleLine = "";
  if (today >= 0) {
    let next = -1;
    for (let k = 0; k < 7; k++) {
      const i = (today + k) % 7;
      if (SCHEDULE[i].live && !(k === 0 && hour >= LIVE_END_HOUR)) { next = k; break; }
    }
    if (next >= 0) {
      const i = (today + next) % 7;
      const when = next === 0 ? "azi" : next === 1 ? "mâine" : SCHEDULE[i].day.toLowerCase();
      scheduleLine = `Următorul live din program: <span>${esc(when)}, de la ${esc(LIVE_START)}</span>`;
      document.getElementById("next").innerHTML = scheduleLine;
    }
  }

  // ===== LIVE NOW from Stream Hub =====
  let heroRef = document.getElementById("onair-hero");
  const nextEl = document.getElementById("next");
  const showLive = live => {
    const on = [];
    LINKS.forEach(l => {
      if (!l.live) return;
      const el = document.querySelector(`[data-live="${l.live}"]`);
      if (!el) return;
      const isLive = live[l.live] === true;
      el.classList.toggle("is-live", isLive);
      el.href = isLive && l.liveUrl ? l.liveUrl : l.url;
      el.setAttribute("aria-label", isLive ? `${l.name} - LIVE acum` : l.name);
      if (isLive) on.push(l);
    });
    // Hero pill: a link to the live stream while live, the plain brand label otherwise.
    const heroLive = on.length > 0;
    if (heroLive !== (heroRef.tagName === "A")) {
      const next = document.createElement(heroLive ? "a" : "span");
      next.id = "onair-hero";
      next.className = "live";
      heroRef.replaceWith(next);
      heroRef = next;
    }
    const h = heroRef;
    h.classList.toggle("on", heroLive);
    h.textContent = heroLive ? "LIVE ACUM" : "LIVE";
    if (heroLive) { h.href = on[0].liveUrl || on[0].url; h.target = "_blank"; h.rel = "noopener"; }
    nextEl.innerHTML = heroLive
      ? `Sunt live acum pe <span>${on.map(l => esc(l.name.replace(/ LIVE$/, ""))).join(", ")}</span>!`
      : scheduleLine;
  };
  const checkLive = async () => {
    let live = {};
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 8000);
      const res = await fetch(`${LIVE_STATUS_URL}?t=${Date.now()}`, { cache: "no-store", signal: ctl.signal });
      clearTimeout(timer);
      if (res.ok) {
        const data = await res.json();
        if (data && data.app === "danceboybb-stream-hub" && data.live && typeof data.live === "object") live = data.live;
      }
    } catch (e) { /* Stream Hub off or unreachable: offline */ }
    showLive(live);
  };
  if (LIVE_STATUS_URL) {
    checkLive();
    setInterval(() => { if (!document.hidden) checkLive(); }, LIVE_CHECK_SECONDS * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) checkLive(); });
  }

  document.getElementById("year").textContent = new Date().getFullYear();

  const btn = document.getElementById("copy");
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(SITE_URL);
      btn.textContent = "Link copiat!";
    } catch (e) {
      btn.textContent = SITE_URL;
    }
    setTimeout(() => { btn.textContent = "Copiază linkul paginii"; }, 2000);
  });
}
</script>
</body>
</html>
